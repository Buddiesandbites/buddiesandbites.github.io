<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest-admin.json">
<meta name="theme-color" content="#572516">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BnB Admin">
<title>Buddies and Bites — Ads Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --cream:#F7F1E4; --paper:#FFFCF6; --plum:#572516; --plum-light:#7A3B26;
    --gold:#C6952F; --sage:#748C6A; --rust:#B0432A; --ink:#2A211F; --ink-soft:#6b5f57; --line:#E4D8C1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--cream); color:var(--ink); font-family:'DM Sans',sans-serif; min-height:100vh; padding-bottom:60px; }
  h1,h2,.display{ font-family:'Fraunces', serif; }
  .mono{ font-family:'Space Mono', monospace; }

  header.top{ background:var(--plum); color:var(--cream); padding:20px 18px 18px; text-align:center; border-bottom:3px solid var(--gold); position:sticky; top:0; z-index:20; }
  .header-logo{ width:130px; height:73px; border-radius:11px; overflow:hidden; margin:0 auto 8px; border:1.5px solid var(--gold); background:var(--paper); }
  header.top .eyebrow{ font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); }
  header.top h1{ margin:3px 0 0; font-size:24px; font-weight:600; font-style:italic; background:linear-gradient(90deg, var(--gold), #EED9A8 45%, var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header.top .sub{ font-size:12px; color:rgba(247,241,228,0.65); margin-top:4px; }
  .role-badge{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:4px 10px; border-radius:999px; background:rgba(247,241,228,0.12); border:1px solid rgba(247,241,228,0.3); color:var(--cream); margin-top:8px; }
  .logout-link{ color:var(--gold); text-decoration:underline; cursor:pointer; margin-left:8px; }

  main{ max-width:640px; margin:0 auto; padding:16px; }
  .back-link{ display:inline-block; font-size:12.5px; color:var(--plum); margin-bottom:14px; text-decoration:none; font-weight:700; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px; }
  .card h2{ font-size:16px; margin:0 0 4px; }
  .card .hint{ font-size:11.5px; color:var(--ink-soft); margin-bottom:12px; }

  .slide-photo{
    border:1.5px dashed var(--line); border-radius:12px; background:#fff;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px;
    padding:16px; cursor:pointer; color:var(--ink-soft); font-size:12.5px; position:relative; overflow:hidden; min-height:120px; margin-bottom:10px;
  }
  .slide-photo img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .slide-photo .hint-over{ position:relative; z-index:1; background:rgba(42,33,31,.55); color:#fff; padding:4px 10px; border-radius:6px; font-size:11px; }
  .slide-photo input{ display:none; }
  .remove-slide{ font-size:11.5px; color:var(--rust); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; }

  .btn{ padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14.5px; cursor:pointer; font-family:'DM Sans',sans-serif; width:100%; }
  .btn-primary{ background:var(--plum); color:var(--cream); }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--cream); padding:10px 18px; border-radius:999px; font-size:13px; z-index:60; opacity:0; pointer-events:none; transition:.2s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  /* Login */
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--plum); }
  .login-card{ background:var(--paper); border-radius:18px; padding:32px 26px; width:100%; max-width:360px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
  .login-card .brand-mark{ width:160px; height:90px; border-radius:12px; overflow:hidden; margin:0 auto 14px; border:1.5px solid var(--gold); background:var(--paper); }
  .login-card h1{ font-size:22px; margin:0 0 4px; font-style:italic; }
  .login-card .sub{ font-size:12.5px; color:var(--ink-soft); margin-bottom:22px; }
  .login-card input{ width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:#fff; font-family:'DM Sans',sans-serif; font-size:15px; margin-bottom:12px; color:var(--ink); }
  .login-card button{ width:100%; padding:13px; border-radius:10px; border:none; background:var(--plum); color:var(--cream); font-weight:700; font-size:14.5px; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .login-error{ color:var(--rust); font-size:12.5px; margin-top:10px; min-height:16px; }
  body.read-only .btn-primary, body.read-only .remove-slide{ display:none !important; }
</style>

<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw-admin.js').catch(e => console.error('SW registration failed', e));
    });
  }
</script>
</head>

  <h1>Ads Manager</h1>
  <div class="sub">Sliding banner on your customer shop page</div>
  <div class="role-badge" id="roleBadge">👤 <span id="roleLabel"></span><span class="logout-link" id="logoutLink">Log out</span></div>

<main>
  <a class="back-link" href="buddies-and-bites-admin.html">← Back to Product Manager</a>

  <div class="card">
    <h2>Banner slides</h2>
    <div class="hint">Add up to 3 images. They'll auto-slide on your shop page every few seconds.</div>
    <div id="slidesWrap"></div>
    <button class="btn btn-primary" id="addSlideBtn" type="button" style="margin-bottom:10px;">+ Add a slide</button>
    <button class="btn btn-primary" id="saveSlidesBtn">Save banner</button>
  </div>
</main>

</div><!-- /appRoot -->

<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const toastEl = $('toast');
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('show'); setTimeout(()=>toastEl.classList.remove('show'), 2000); }

  const firebaseConfig = {
    apiKey: "AIzaSyBajPDaFx1rO1FWcwLpUDSaoKyXPSBsEgc",
    authDomain: "buddiesandbites-e5f79.firebaseapp.com",
    projectId: "buddiesandbites-e5f79",
    storageBucket: "buddiesandbites-e5f79.firebasestorage.app",
    messagingSenderId: "363392424539",
    appId: "1:363392424539:web:40fd1a6bab09cdba723d7e"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const adsDoc = db.collection('meta').doc('adsBanner');

  let slides = [];

  function compressImage(file, maxW, quality){
    maxW = maxW || 420; quality = quality != null ? quality : 0.45;
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          let dataUrl = canvas.toDataURL('image/webp', quality);
          if(!dataUrl.startsWith('data:image/webp')){
            dataUrl = canvas.toDataURL('image/jpeg', quality);
          }
          resolve(dataUrl);
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function renderSlides(){
    const wrap = $('slidesWrap');
    wrap.innerHTML = '';
    slides.forEach((s, i) => {
      const box = document.createElement('div');
      box.innerHTML = `
        <label class="slide-photo">
          ${s.image ? '<img src="'+s.image+'">' : ''}
          <span class="hint-over" style="${s.image ? '' : 'display:none;'}">Tap to change</span>
          ${!s.image ? '<span>Tap to upload slide '+(i+1)+'</span>' : ''}
          <input type="file" accept="image/*" class="slide-input">
        </label>
        <button type="button" class="remove-slide">Remove this slide</button>
      `;
      box.querySelector('.slide-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if(!file) return;
        try{
          slides[i].image = await compressImage(file, 800, 0.55);
          renderSlides();
        }catch(err){ toast("Couldn't read that photo"); }
      });
      box.querySelector('.remove-slide').addEventListener('click', () => {
        slides.splice(i, 1);
        renderSlides();
      });
      wrap.appendChild(box);
    });
  }

  $('addSlideBtn').addEventListener('click', () => {
    if(isReadOnly) return;
    if(slides.length >= 3){ toast('Maximum 3 slides'); return; }
    slides.push({ image: null });
    renderSlides();
  });

  $('saveSlidesBtn').addEventListener('click', async () => {
    if(isReadOnly) return;
    const validSlides = slides.filter(s => s.image);
    try{
      await adsDoc.set({ slides: validSlides }, { merge: true });
      toast('Banner saved');
    }catch(e){ toast('Could not save — check your connection'); }
  });

  adsDoc.get().then(doc => {
    if(doc.exists && doc.data().slides){
      slides = doc.data().slides;
      renderSlides();
    }
  }).catch(e => console.error(e));

  // ---------- Auth ----------
  const CREDENTIALS = {
    'Buddies&bites': { password: 'Buddies@519', role: 'master', label: 'Master Admin' },
    'Aman': { password: 'Aman@519', role: 'readonly', label: 'Aman (View only)' }
  };
  const AUTH_KEY = 'bnb_auth';
  let isReadOnly = false;

  function showApp(session){
    isReadOnly = session.role === 'readonly';
    document.body.classList.toggle('read-only', isReadOnly);
    $('loginScreen').style.display = 'none';
    $('appRoot').style.display = 'block';
    $('roleLabel').textContent = CREDENTIALS[session.username] ? CREDENTIALS[session.username].label : session.username;
  }

  $('loginBtn').addEventListener('click', () => {
    const user = $('loginUser').value.trim();
    const pass = $('loginPass').value;
    const cred = CREDENTIALS[user];
    if(!cred || cred.password !== pass){ $('loginError').textContent = 'Incorrect username or password'; return; }
    const session = { username: user, role: cred.role };
    localStorage.setItem(AUTH_KEY, JSON.stringify(session));
    showApp(session);
  });
  $('loginPass').addEventListener('keydown', (e) => { if(e.key === 'Enter') $('loginBtn').click(); });
  $('logoutLink').addEventListener('click', () => { localStorage.removeItem(AUTH_KEY); location.reload(); });

  (function checkExistingSession(){
    try{
      const raw = localStorage.getItem(AUTH_KEY);
      if(raw){
        const session = JSON.parse(raw);
        if(session && CREDENTIALS[session.username] && CREDENTIALS[session.username].role === session.role){
          showApp(session);
          return;
        }
      }
    }catch(e){}
    $('loginScreen').style.display = 'flex';
    $('appRoot').style.display = 'none';
  })();

})();
</script>
</body>
